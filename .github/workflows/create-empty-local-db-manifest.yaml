name: Create Empty Local DB Manifest

env:
  SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
  SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
  SPACES_REGION: ${{ secrets.SPACES_REGION }}
  SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
  SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-empty-manifest:
    runs-on: ubuntu-latest
    outputs:
      manifest_url: ${{ steps.create_manifest.outputs.manifest_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Create and upload empty manifest
        id: create_manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="$(nix run .#local-db-create-empty-manifest)"
          echo "manifest_url=$manifest_url" >>"$GITHUB_OUTPUT"

      - name: Summarize manifest URL
        shell: bash
        run: |
          {
            echo "## Empty Local DB Manifest"
            echo
            echo "- Manifest URL: ${{ steps.create_manifest.outputs.manifest_url }}"
          } >>"$GITHUB_STEP_SUMMARY"

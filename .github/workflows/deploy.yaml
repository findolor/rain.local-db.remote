name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to deploy from
        required: true
        default: main
        type: string
      allow_non_main:
        description: Allow deployment from a non-main ref
        required: true
        default: false
        type: boolean
      settings_url:
        description: Settings YAML URL to deploy
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  HYPER_RPC_API_TOKEN: ${{ secrets.HYPER_RPC_API_TOKEN }}
  PUBLIC_WALLETCONNECT_PROJECT_ID: "00000000000000000000000000000000"
  SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
  SPACES_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}
  TAILSCALE_HOSTNAME: local-db-remote
  TARGET_REF: ${{ inputs.target_ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" != "main" ] && [ "${{ inputs.allow_non_main }}" != "true" ]; then
            echo "Set allow_non_main=true to deploy from a non-main ref." >&2
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          submodules: recursive
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            fallback = true
            sandbox = false

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Load encrypted runtime config
        uses: ./.github/actions/load-runtime-config
        with:
          ssh_key: ${{ secrets.SSH_KEY }}

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare raindex submodule
        run: ./prep.sh

      - name: Build local CLI artifact
        run: nix run .#build-raindex-cli

      - name: Resolve host over Tailscale
        shell: bash
        run: |
          set -euo pipefail
          host_ip="$(tailscale ip -4 "$TAILSCALE_HOSTNAME")"
          echo "::add-mask::$host_ip"
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"

      - name: Trust host key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts

      - name: Deploy NixOS configuration
        env:
          DEPLOY_HOST: ${{ env.HOST_IP }}
        run: nix run .#deploy-nixos

      - name: Upload runtime assets and restart service
        env:
          SETTINGS_URL_INPUT: ${{ inputs.settings_url }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/local-db-remote.env <<EOF
          SETTINGS_YAML_URL=$SETTINGS_URL_INPUT
          HYPER_RPC_API_TOKEN=$HYPER_RPC_API_TOKEN
          DUMP_BASE_URL=$DUMP_BASE_URL
          SPACES_ACCESS_KEY=$SPACES_ACCESS_KEY
          SPACES_SECRET_KEY=$SPACES_SECRET_KEY
          SPACES_REGION=$SPACES_REGION
          SPACES_BUCKET=$SPACES_BUCKET
          SPACES_ENDPOINT=$SPACES_ENDPOINT
          EOF

          ssh -i ~/.ssh/id_ed25519 "root@$HOST_IP" '
            set -euo pipefail
            mkdir -p /etc/local-db-remote /var/lib/local-db-remote/bin
            systemctl stop local-db-sync.timer || true
            systemctl stop local-db-sync.service || true
            if systemctl is-active --quiet local-db-sync.service; then
              systemctl kill local-db-sync.service || true
            fi
          '

          scp -i ~/.ssh/id_ed25519 ./rain-orderbook-cli "root@$HOST_IP:/var/lib/local-db-remote/bin/rain-orderbook-cli.tmp"
          scp -i ~/.ssh/id_ed25519 /tmp/local-db-remote.env "root@$HOST_IP:/etc/local-db-remote/env.tmp"

          ssh -i ~/.ssh/id_ed25519 "root@$HOST_IP" '
            set -euo pipefail
            install -m 0755 /var/lib/local-db-remote/bin/rain-orderbook-cli.tmp /var/lib/local-db-remote/bin/rain-orderbook-cli
            install -m 0600 /etc/local-db-remote/env.tmp /etc/local-db-remote/env
            rm -f /var/lib/local-db-remote/bin/rain-orderbook-cli.tmp /etc/local-db-remote/env.tmp
            systemctl daemon-reload
            systemctl restart local-db-sync.timer
            systemctl start local-db-sync.service
          '

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "## Local DB Remote Deployment"
            echo
            echo "- Target ref: $TARGET_REF"
            echo "- Host IP: $HOST_IP"
            echo "- Settings URL: ${{ inputs.settings_url }}"
            echo "- Timer: local-db-sync.timer"
            echo "- Service: local-db-sync.service"
          } >> "$GITHUB_STEP_SUMMARY"
